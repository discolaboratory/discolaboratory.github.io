<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Discovery Lab at UCSF</title>
    <meta name="description" content="This Discovery Lab page could not be found. Return to the lab homepage or contact us.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://discolab.org/404.html">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0B0C10;
            --ink: #E6E8E9;
            --muted: #A0ADB5;
            --accent: #66FCF1;
            --line: #2C353F;
            --button-ink: #0B0C10;
        }
        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --bg: #F7F2E9;
                --ink: #201B16;
                --muted: #6A6056;
                --accent: #086F69;
                --line: #D6CBBE;
                --button-ink: #F7F2E9;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            color: var(--ink);
            background: var(--bg);
            font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
        }
        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 32px 24px 48px;
        }
        .brand {
            display: inline-block;
            padding: 8px 0;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
        }
        main { max-width: 660px; margin: clamp(60px, 17vh, 150px) 0 100px; }
        .code {
            margin: 0 0 20px;
            color: var(--accent);
            font-family: "Courier New", monospace;
            font-size: 1rem;
            letter-spacing: 0.08em;
        }
        h1 { margin: 0 0 20px; font-size: clamp(2.25rem, 6vw, 4rem); line-height: 1.1; font-weight: 600; }
        p { font-size: 1.1rem; line-height: 1.65; }
        .description { max-width: 520px; margin: 0 0 32px; color: var(--muted); }
        a { color: var(--accent); text-underline-offset: 0.2em; }
        .home {
            display: inline-flex;
            align-items: center;
            min-height: 48px;
            padding: 13px 20px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: var(--button-ink);
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.3;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
        a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
        .contact { margin-top: 28px; color: var(--muted); font-size: 1rem; }
        .contact a { display: inline-block; padding: 6px 0; overflow-wrap: anywhere; }
        footer { border-top: 1px solid var(--line); padding-top: 20px; color: var(--muted); font-size: 0.85rem; line-height: 1.6; }
        @media (max-width: 400px) { .page { padding-inline: 20px; } }
    </style>
</head>
<body>
    <div class="page">
        <header><a class="brand" href="https://discolab.org/">Discovery Lab at UCSF</a></header>
        <main>
            <p class="code">404</p>
            <h1>Page not found.</h1>
            <p class="description">The page may have moved, or the address may be incorrect. Find our research, people and contact details on the lab homepage.</p>
            <a class="home" href="https://discolab.org/">Return to Discovery Lab home</a>
            <p class="contact">Need help? <a href="mailto:bcheung@ucsf.edu">bcheung@ucsf.edu</a></p>
        </main>
        <footer>Discovery Lab · University of California, San Francisco</footer>
    </div>
</body>
</html>
